<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Email AI - Settings</title>
    <link rel="stylesheet" href="options.css">
</head>

<body>

    <div class="container">

        <h1>Smart Email AI Assistant</h1>

        <p class="subtitle">
            Configure your Gemini API key
        </p>

        <div class="card">

            <label for="apiKey">
                Gemini API Key
            </label>

            <input
                type="password"
                id="apiKey"
                placeholder="Enter your Gemini API key"
            >

            <p class="info">
                Your API key is stored locally in your browser and is not
                included in the extension code.
            </p>

            <div class="buttons">
                <button id="saveButton">
                    Save API Key
                </button>

                <button id="deleteButton" class="delete">
                    Delete API Key
                </button>
            </div>

            <p id="status"></p>

        </div>

    </div>

    <script src="options.js"></script>

</body>
</html>
